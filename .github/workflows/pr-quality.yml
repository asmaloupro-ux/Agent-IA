# Sur chaque PR : CI (lint, tests, build) puis revue automatique par Claude.
name: PR - Qualité du code

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (lint, tests, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # --- Node.js : détecté si package.json existe ---
      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node - install, lint, test, build
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

      # --- Python : détecté si requirements.txt ou pyproject.toml existe ---
      - name: Setup Python
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python - install, lint, test
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install ruff pytest
          ruff check .
          if ls tests test 2>/dev/null | grep -q .; then pytest; else echo "Aucun dossier de tests"; fi

      - name: Aucun code applicatif
        if: hashFiles('package.json', 'requirements.txt', 'pyproject.toml') == ''
        run: echo "Pas de package.json / requirements.txt / pyproject.toml - CI ignorée."

  claude-review:
    name: Revue Claude
    needs: ci
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Un seul des deux est nécessaire (voir README) :
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            RÉSULTAT DE LA CI : ${{ needs.ci.result }}

            Tu es l'agent debug-tester (voir .claude/agents/debug-tester.md) et tu fais
            la revue de cette PR. Réponds en français.

            1. Lis la PR (gh pr view, gh pr diff) et le code concerné.
            2. Si la CI a échoué, lis les logs (gh run view --log-failed) et explique
               la cause racine avec la correction proposée.
            3. Vérifie la qualité du code :
               - bugs et cas limites non gérés
               - sécurité (secrets en dur, injections, validation des entrées)
               - performance
               - lisibilité et cohérence avec le style existant
               - tests manquants pour le code modifié
            4. Laisse des commentaires en ligne (create_inline_comment) uniquement pour
               les vrais problèmes, avec une suggestion de correction.
            5. Termine par UN commentaire de synthèse (gh pr comment) au format :
               ## Revue Claude
               **Verdict :** ✅ Prêt à merger / ⚠️ À corriger / ❌ Bloquant
               **CI :** résultat + cause si échec
               **Problèmes trouvés :** liste par gravité
               **Tests manquants :** ...
            Ne signale pas de problèmes de style mineurs. Sois factuel et concis.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run list:*)"
